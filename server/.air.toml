root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/app"
bin = "tmp/main"
include_ext = ["go", "tmpl"]
exclude_dir = ["assets", "tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
stop_on_error = false

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[proxy]
enabled = false