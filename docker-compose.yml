version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./.env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: 
      context: ./server
      dockerfile: ./Dockerfile.server
    env_file:
      - ./.env.docker
    ports:
      - "8080:8080"
    depends_on:
      - db
    profiles: ["prod"]

  client:
    build: 
      context: ./client
      dockerfile: ./Dockerfile.client
    env_file:
      - ./.env.docker
    ports:
      - "80:80"
    profiles: ["prod"]

  server-dev:
    build: 
      context: ./server
      dockerfile: ./Dockerfile.server
      target: dev
    env_file:
      - ./.env.docker
    volumes:
      - ./server:/app
    ports:
      - "8080:8080"
    depends_on:
      - db
    profiles: ["dev"]

  client-dev:
    build: 
      context: ./client
      dockerfile: ./Dockerfile.client
      target: dev
    env_file:
      - ./.env.docker
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - db
    profiles: ["dev"]

volumes:
  pgdata: